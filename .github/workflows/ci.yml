name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tmux-plugins/tmux-resurrect
          ref: cff343cf9e81983d3da0c8562b01616f12e8d548
          path: vendor/resurrect
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libevent-dev libncurses-dev pkg-config
      - if: runner.os == 'Linux'
        run: bash scripts/ci-tmux.sh
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: python3 tests/installer.py && python3 tests/cold_install_lifecycle.py && python3 tests/lifecycle.py && python3 tests/directories.py && python3 tests/restore.py
