name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tmux-plugins/tmux-resurrect
          ref: cff343cf9e81983d3da0c8562b01616f12e8d548
          path: vendor/resurrect
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential libevent-dev libncurses-dev pkg-config
      - if: runner.os == 'Linux'
        run: bash scripts/ci-tmux.sh
      - if: runner.os == 'macOS'
        run: brew install tmux
      - name: Check release version
        shell: bash
        run: |
          version=$(cat VERSION)
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')" = "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/}" = "v$version"; fi
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python3 tests/installer.py && python3 tests/cold_install_lifecycle.py && python3 tests/lifecycle.py && python3 tests/directories.py && python3 tests/restore.py
        env:
          TMUX_SESSION_BIN: target/${{ matrix.target }}/release/tmux-session
      - name: Package
        shell: bash
        run: |
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/tmux-session LICENSE staging/
          archive="tmux-session-v$(cat VERSION)-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C staging tmux-session LICENSE
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
