[package]
name = "tmux-session"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Event-driven tmux-resurrect autosave without status polling"
license = "MIT"
repository = "https://github.com/lidongpeng36/tmux-session"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true
